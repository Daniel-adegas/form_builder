<template>
    <lightning-card title="Form Builder Documentation" icon-name="standard:knowledge">
        <div class="slds-p-around_medium">
            
            <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>
                
                <!-- Overview -->
                <lightning-accordion-section name="overview" label="Overview">
                    <div class="slds-p-around_small">
                        <p class="slds-text-body_regular slds-m-bottom_small">
                            The Form Builder application allows you to create dynamic, multi-page forms 
                            entirely through point-and-click configuration. Forms support scoring, 
                            conditional logic (dependencies), multi-language translations, and 
                            automatic data write-back to Salesforce records.
                        </p>
                        <p class="slds-text-body_regular slds-m-bottom_small">
                            <strong>Cross-field validation:</strong> You can author rules in the Visual Builder (Date and Number questions)
                            that compare one answer to another; they are stored on each question and included in the form definition
                            from Apex. The client-side form renderer must still implement evaluation of those rules, show errors on the
                            correct inputs, and block submit when invalid — see <em>Features Overview</em>, <em>Known Limitations</em>, and
                            <em>Architecture Decisions</em> for how the builder side connects to the runtime side.
                        </p>
                        <p class="slds-text-body_regular">
                            Below you will find an explanation of each component in the system 
                            and a step-by-step guide to creating your first form.
                        </p>
                    </div>
                </lightning-accordion-section>

                <!-- Features -->
                <lightning-accordion-section name="features" label="Features Overview">
                    <div class="slds-p-around_small">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <template for:each={featuresList} for:item="feat">
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small" key={feat.title}>
                                    <div class="slds-box slds-theme_shade" style="min-height: 90px;">
                                        <p class="slds-text-heading_small slds-m-bottom_xx-small">
                                            <strong>{feat.title}</strong>
                                        </p>
                                        <p class="slds-text-body_small">{feat.description}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-accordion-section>

                <!-- Data Model -->

                            The Form Builder uses 14 custom objects. Here is what each one does 
                            in plain language:
                        </p>

                            <div class="slds-box slds-m-bottom_small slds-theme_shade" key={obj.name}>
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                    <lightning-icon icon-name={obj.icon} size="small"

                                </div>
                                <p class="slds-text-body_regular slds-m-bottom_x-small">{obj.description}</p>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    <strong>Key Fields:</strong> {obj.keyFields}
                                </p>
                                <p class="slds-text-body_small" style="color: #0070d2; font-style: italic;">

                                </p>
                            </div>

                <!-- Scoring -->
                <lightning-accordion-section name="scoring" label="How Scoring Works">
                    <div class="slds-p-around_small">
                        <div class="slds-box slds-theme_shade">
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Section Weight:</strong> Each Section has a weight percentage. 
                                All non-bonus, non-excluded section weights should add up to 100%.
                            </p>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Question Points:</strong> Each Response option has a point value. 
                                The highest possible points for a question becomes the "max points" for that question.
                            </p>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Section Score:</strong> (Earned Points / Max Points) x 100 = Section Score %
                            </p>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Final Score:</strong> Sum of (Section Score x Section Weight) / Total Weight x 100
                            </p>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Bonus Sections:</strong> Bonus section scores are added on top of the final score, 
                                allowing the total to potentially exceed 100% (capped at 100%).
                            </p>
                            <p class="slds-text-body_regular">
                                <strong>Locks Question:</strong> If a Response has "Locks Question" checked, 
                                selecting it sets the question weight to 0, effectively removing it from scoring.
                            </p>
                        </div>
                    </div>
                </lightning-accordion-section>

                <!-- Dependencies -->

                        <div class="slds-box slds-theme_shade">
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                Dependencies control the dynamic show/hide behaviour of form elements:
                            </p>
                            <ul class="slds-list_dotted slds-m-bottom_small">
                                <li><strong>Controlling Response:</strong> The Response that triggers the dependency</li>
                                <li><strong>Target Type:</strong> What to affect - a Page, Section, or Question</li>
                                <li><strong>Action:</strong> Show, Hide, or Require the target when the controlling response is selected</li>
                                <li><strong>Logic Group &amp; Operator:</strong> Combine multiple dependencies with AND/OR logic</li>
                            </ul>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>"Show" action:</strong> The target is hidden by default and only becomes visible 
                                when the controlling response is selected.
                            </p>
                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>"Hide" action:</strong> The target is visible by default and becomes hidden 
                                when the controlling response is selected.
                            </p>
                            <p class="slds-text-body_regular">
                                <strong>"Require" action:</strong> Makes a target question conditionally required 
                                when the controlling response is selected. Only applicable to Question targets.
                            </p>
                        </div>
                    </div>

                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <lightning-icon icon-name="utility:adjust_value" size="small" class="slds-m-right_small"></lightning-icon>
                                <h3 class="slds-text-heading_small"><strong>Medium Effort</strong></h3>
                                <span class="slds-badge slds-theme_warning slds-m-left_small">Extend existing modules</span>
                            </div>
                            <template for:each={roadmapMediumEffort} for:item="item">
                                <div class="slds-box slds-m-bottom_x-small" key={item.title}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                        <h4 class="slds-text-body_regular"><strong>{item.title}</strong></h4>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak">{item.description}</p>
                                </div>
                            </template>
                        </div>

                        <!-- Low Effort -->
                        <div class="slds-m-bottom_medium">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <lightning-icon icon-name="utility:check" size="small" class="slds-m-right_small"></lightning-icon>
                                <h3 class="slds-text-heading_small"><strong>Low Effort</strong></h3>
                                <span class="slds-badge slds-theme_success slds-m-left_small">Quick wins / config changes</span>
                            </div>
                            <template for:each={roadmapLowEffort} for:item="item">
                                <div class="slds-box slds-m-bottom_x-small" key={item.title}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                        <h4 class="slds-text-body_regular"><strong>{item.title}</strong></h4>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak">{item.description}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-accordion-section>

                <!-- Development History -->
                <lightning-accordion-section name="history" label="Development History">
                    <div class="slds-p-around_small">
                        <template for:each={developmentHistory} for:item="entry">
                            <div class="slds-box slds-m-bottom_small slds-theme_shade" key={entry.version}>
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                    <lightning-icon icon-name="standard:task2" size="small" 
                                        class="slds-m-right_small"></lightning-icon>
                                    <h3 class="slds-text-heading_small">
                                        <strong>Version {entry.version}</strong>
                                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">
                                            {entry.date} - {entry.author}
                                        </span>
                                    </h3>
                                </div>
                                <p class="slds-text-body_regular">{entry.changes}</p>
                            </div>
                        </template>
                    </div>
                </lightning-accordion-section>

            </lightning-accordion>
        </div>
    </lightning-card>
</template>
