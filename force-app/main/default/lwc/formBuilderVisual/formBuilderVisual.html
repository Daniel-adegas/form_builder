<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <!-- ==================== FORM LIST VIEW ==================== -->
    <template if:true={isListView}>
        <lightning-card title="Visual Form Builder" icon-name="custom:custom63">
            <lightning-button
                label="New Form"
                variant="brand"
                icon-name="utility:add"
                slot="actions"
                onclick={handleOpenNewForm}
            ></lightning-button>

            <div class="slds-p-around_medium">
                <div class="slds-m-bottom_medium">
                    <lightning-input
                        type="search"
                        label="Search Forms"
                        variant="label-hidden"
                        placeholder="Search by name or description..."
                        value={formSearchTerm}
                        onchange={handleFormSearch}
                    ></lightning-input>
                </div>
                <template if:true={hasFilteredForms}>
                    <template for:each={filteredForms} for:item="form">
                        <div key={form.Id} class="form-card" data-id={form.Id} onclick={handleFormSelect}>
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-grow">
                                    <div class="form-card-title-row">
                                        <h3 class="slds-text-heading_small">{form.Name}</h3>
                                        <template if:true={form.isLatest}>
                                            <span class="latest-badge">Latest</span>
                                        </template>
                                        <template if:true={form.displayVersion}>
                                            <span class="version-badge">{form.displayVersion}</span>
                                        </template>
                                    </div>
                                    <template if:true={form.C_Description__c}>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small form-card-desc">{form.C_Description__c}</p>
                                    </template>
                                    <p class="form-card-meta">
                                        <lightning-icon icon-name="utility:clock" size="xx-small" class="form-card-meta-icon"></lightning-icon>
                                        Modified {form.formattedDate}
                                    </p>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <span class="type-badge">{form.C_Status__c}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={hasFilteredForms}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <div class="slds-text-align_center">
                            <lightning-icon icon-name="utility:form" size="large" class="slds-m-bottom_small"></lightning-icon>
                            <template if:true={formSearchTerm}>
                                <p class="slds-text-heading_small slds-m-top_small">No forms match your search</p>
                                <p class="slds-text-body_regular slds-text-color_weak">Try a different search term</p>
                            </template>
                            <template if:false={formSearchTerm}>
                                <p class="slds-text-heading_small slds-m-top_small">No forms yet</p>
                                <p class="slds-text-body_regular slds-text-color_weak">Click "New Form" to get started</p>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </lightning-card>

        <!-- New Form Modal -->
        <template if:true={showNewFormModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseNewForm}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">New Form</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            label="Form Name"
                            value={newFormName}
                            onchange={handleNewFormNameChange}
                            required
                        ></lightning-input>
                        <lightning-textarea
                            label="Description"
                            value={newFormDescription}
                            onchange={handleNewFormDescriptionChange}
                            class="slds-m-top_small"
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseNewForm} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Create" variant="brand" onclick={handleCreateForm}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </template>

    <!-- ==================== BUILDER VIEW ==================== -->
    <template if:true={isBuilderView}>
        <div class={builderLayoutClass}>

            <!-- ===== LEFT: TOOLBOX ===== -->
            <template if:true={showRepositoryToolbox}>
                <div class="toolbox-panel">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Toolbox</h3>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Drag items onto the canvas</p>

                    <template for:each={toolboxItems} for:item="item">
                        <div
                            key={item.key}
                            class="toolbox-item"
                            draggable="true"
                            data-dragtype={item.dragType}
                            data-questiontype={item.questionType}
                            ondragstart={handleToolboxDragStart}
                            ondragend={handleDragEnd}
                        >
                            <lightning-icon icon-name={item.icon} size="x-small"></lightning-icon>
                            <span>{item.label}</span>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ===== CENTER: CANVAS ===== -->
            <div class={canvasClass}>
                <!-- Toolbar -->
                <div class="toolbar">
                    <template if:true={showBuilderBackButton}>
                        <lightning-button-icon
                            icon-name="utility:back"
                            alternative-text="Back"
                            onclick={handleBackToList}
                        ></lightning-button-icon>
                    </template>
                    <h2 class="slds-text-heading_small slds-grow" onclick={handleFormHeaderClick} style="cursor: pointer;">
                        {formName}
                    </h2>
                    <span class="type-badge">{formStatus}</span>
                    <lightning-button
                        label={previewButtonLabel}
                        variant={previewButtonVariant}
                        icon-name={previewButtonIcon}
                        onclick={togglePreview}
                    ></lightning-button>
                    <template if:false={repositoryAssetEditUi}>
                        <lightning-button
                            label="Dependencies"
                            variant={dependencyButtonVariant}
                            icon-name="utility:flow"
                            onclick={toggleDependencyBuilder}
                        ></lightning-button>
                    </template>
                    <template if:true={showFieldMapping}>
                        <template if:false={repositoryAssetEditUi}>
                            <lightning-button
                                label="Field Mapping"
                                variant={fieldMappingButtonVariant}
                                icon-name="utility:database"
                                onclick={toggleFieldMappingPanel}
                            ></lightning-button>
                        </template>
                    </template>
                    <template if:true={showCloneInToolbar}>
                        <lightning-button
                            label="Clone"
                            icon-name="utility:copy"
                            variant="neutral"
                            onclick={handleOpenCloneModal}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </template>
                    <template if:true={showConfigInToolbar}>
                        <lightning-button
                            label="Config"
                            icon-name="utility:settings"
                            variant="neutral"
                            onclick={handleOpenConfigModal}>
                        </lightning-button>
                    </template>
                </div>

                <!-- Dependency Builder Panel -->
                <template if:true={showDependencyBuilder}>
                    <div class="slds-box slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Dependency Builder</h3>

                        <template if:true={hasDependencies}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_small">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">When response...</div></th>
                                        <th scope="col"><div class="slds-truncate">Action</div></th>
                                        <th scope="col"><div class="slds-truncate">Target</div></th>
                                        <th scope="col" style="width: 60px;"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={enrichedDependencies} for:item="dep">
                                        <tr key={dep.Id}>
                                            <td><div class="slds-truncate" title={dep.controllingResponseLabel}>{dep.controllingResponseLabel}</div></td>
                                            <td><div class="slds-truncate"><span class={dep.C_Action__c}>{dep.C_Action__c}</span></div></td>
                                            <td><div class="slds-truncate" title={dep.targetLabel}>{dep.targetLabel}</div></td>
                                            <td>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Delete"
                                                    variant="bare"
                                                    data-id={dep.Id}
                                                    onclick={handleDeleteDependency}
                                                ></lightning-button-icon>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-end">
                            <div class="slds-col">
                                <lightning-combobox
                                    label="Controlling Response"
                                    value={newDependency.C_Controlling_Response__c}
                                    options={allResponses}
                                    data-field="C_Controlling_Response__c"
                                    onchange={handleDependencyFieldChange}
                                    placeholder="Select response..."
                                ></lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <lightning-combobox
                                    label="Action"
                                    value={newDependency.C_Action__c}
                                    options={dependencyActionOptions}
                                    data-field="C_Action__c"
                                    onchange={handleDependencyFieldChange}
                                ></lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <lightning-combobox
                                    label="Target Type"
                                    value={newDependency.C_Target_Type__c}
                                    options={dependencyTargetTypeOptions}
                                    data-field="C_Target_Type__c"
                                    onchange={handleDependencyFieldChange}
                                    placeholder="Select type..."
                                ></lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <lightning-combobox
                                    label="Target Element"
                                    value={selectedTargetValue}
                                    options={filteredTargetElements}
                                    onchange={handleDependencyTargetChange}
                                    placeholder="Select target..."
                                    disabled={isTargetComboboxDisabled}
                                ></lightning-combobox>
                            </div>
                            <div class="slds-col slds-no-flex">
                                <lightning-button
                                    label="Add"
                                    variant="brand"
                                    icon-name="utility:add"
                                    onclick={handleSaveDependency}
                                ></lightning-button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Field Mapping Panel -->
                <template if:true={showFieldMappingPanel}>
                    <div class="slds-box slds-m-bottom_medium">
                        <c-form-target-builder
                            form-id={selectedFormId}
                            questions={allQuestionsForMapping}
                            ontoast={handleTargetBuilderToast}
                            onmappingchanged={handleMappingChanged}
                        ></c-form-target-builder>
                    </div>
                </template>

                <!-- ===== EDIT MODE CANVAS ===== -->
                <template if:false={showPreview}>
                    <template if:true={canvasEditHasRows}>
                        <template if:false={repositoryAssetEditUi}>
                            <c-form-builder-drop-zone
                                dropzone="canvas"
                                accepts="category,page"
                                position="0"
                                is-dragging={isDragging}
                                drag-item-type={dragItemType}
                                drag-type={dragType}
                                variant="line"
                                always-expanded
                                drag-label="Drop category or page here"
                                onbuilderdrop={handleBuilderDrop}
                            ></c-form-builder-drop-zone>
                        </template>

                        <template for:each={displayCanvasRows} for:item="row">
                            <div
                                key={row.rowKey}
                                class={row.rowOuterClass}
                                onbuilderdragstart={handleBuilderDragStart}
                                onbuilderdragend={handleBuilderDragEnd}
                                onbuilderdrop={handleBuilderDrop}
                                onbuilderelementclick={handleBuilderElementClick}
                                onbuildertogglecollapse={handleBuilderToggleCollapse}
                                onbuilderquickaddpage={handleBuilderQuickAddPage}
                                onbuilderquickaddsection={handleBuilderQuickAddSection}
                                onbuilderquickaddquestion={handleBuilderQuickAddQuestion}
                                onbuilderquickaddresponse={handleBuilderQuickAddResponse}
                            >
                                <c-form-builder-category-card
                                    row={row}
                                    is-dragging={isDragging}
                                    drag-item-type={dragItemType}
                                    drag-type={dragType}
                                    dragging-source-id={draggingSourceId}
                                    show-scoring={showScoring}
                                    suppress-repository-chrome={row.repositorySuppressCanvasChrome}
                                ></c-form-builder-category-card>
                                <template if:false={repositoryAssetEditUi}>
                                    <c-form-builder-drop-zone
                                        dropzone="canvas"
                                        accepts="category,page"
                                        position={row.dropPosition}
                                        is-dragging={isDragging}
                                        drag-item-type={dragItemType}
                                        drag-type={dragType}
                                        variant="line"
                                        onbuilderdrop={handleBuilderDrop}
                                    ></c-form-builder-drop-zone>
                                </template>
                            </div>
                        </template>
                    </template>

                    <template if:false={canvasEditHasRows}>
                        <div
                            class="empty-canvas"
                            data-dropzone="canvas"
                            data-accepts="category,page"
                            data-position="0"
                            ondragover={handleDragOver}
                            ondrop={handleUnifiedDrop}
                            ondragleave={handleDragLeave}
                        >
                            <lightning-icon icon-name="utility:drag_and_drop" size="large" class="slds-m-bottom_medium"></lightning-icon>
                            <p class="slds-text-heading_small">Drag elements from the toolbox</p>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Add a page to start (a category is created automatically), or add a category first.</p>
                            <template if:false={repositoryAssetEditUi}>
                                <div class="slds-m-top_medium">
                                    <lightning-button
                                        label="Add Page"
                                        variant="brand"
                                        icon-name="utility:add"
                                        class="slds-m-right_small"
                                        onclick={handleQuickAddPage}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Add Category"
                                        variant="neutral"
                                        icon-name="utility:add"
                                        onclick={handleQuickAddCategory}
                                    ></lightning-button>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>

                <!-- ===== PREVIEW MODE ===== -->
                <template if:true={showPreview}>
                    <div class="preview-mode">
                        <template if:true={hasCanvasContent}>
                            <template for:each={displayCanvasRows} for:item="row">
                                <div key={row.rowKey} class="slds-m-bottom_large">
                                    <template if:true={row.isCategoryRow}>
                                    <div class="slds-grid slds-grid_align-center slds-m-bottom_small">
                                        <template for:each={row.pages} for:item="page" for:index="idx">
                                            <div key={page.Id} class="slds-p-horizontal_small slds-text-align_center">
                                                <div class="slds-badge" style="background: #0070d2; color: white;">{page.Name}</div>
                                            </div>
                                        </template>
                                    </div>
                                    </template>

                                    <template for:each={row.pages} for:item="page">
                                        <div key={page.Id} class="canvas-page">
                                            <div class="canvas-page-header">{page.Name}</div>
                                            <div class="slds-p-around_medium">
                                                <template if:true={page.hasSections}>
                                                    <template for:each={page.sections} for:item="section">
                                                        <div key={section.Id} class="slds-m-bottom_medium">
                                                            <h4 class="slds-text-heading_small slds-m-bottom_small" style="color: #04844b; border-bottom: 1px solid #e5e5e5; padding-bottom: 6px;">
                                                                {section.Name}
                                                            </h4>
                                                            <template if:true={section.hasQuestions}>
                                                                <template for:each={section.questions} for:item="question">
                                                                    <div key={question.Id} class="slds-form-element slds-m-bottom_small">
                                                                        <label class="slds-form-element__label">
                                                                            {question.displayLabel}
                                                                            <template if:true={question.C_Is_Required__c}>
                                                                                <abbr class="slds-required" title="required">*</abbr>
                                                                            </template>
                                                                        </label>
                                                                        <div class="slds-form-element__control">
                                                                            <template if:true={question.isTextPreview}>
                                                                                <input type="text" class="slds-input" disabled placeholder={question.C_Placeholder__c} />
                                                                            </template>
                                                                            <template if:true={question.isLongTextPreview}>
                                                                                <textarea class="slds-textarea" disabled placeholder={question.C_Placeholder__c}></textarea>
                                                                            </template>
                                                                            <template if:true={question.isNumberPreview}>
                                                                                <input type="number" class="slds-input" disabled placeholder={question.C_Placeholder__c} />
                                                                            </template>
                                                                            <template if:true={question.isDatePreview}>
                                                                                <input type="date" class="slds-input" disabled />
                                                                            </template>
                                                                            <template if:true={question.isCheckboxPreview}>
                                                                                <div class="slds-checkbox">
                                                                                    <input type="checkbox" disabled id={question.Id} />
                                                                                    <label class="slds-checkbox__label" for={question.Id}>
                                                                                        <span class="slds-checkbox_faux"></span>
                                                                                        <span class="slds-form-element__label">{question.displayLabel}</span>
                                                                                    </label>
                                                                                </div>
                                                                            </template>
                                                                            <template if:true={question.isFilePreview}>
                                                                                <div class="slds-file-selector slds-file-selector_files">
                                                                                    <input type="file" disabled class="slds-file-selector__input" />
                                                                                </div>
                                                                            </template>
                                                                            <template if:true={question.isPicklistPreview}>
                                                                                <template if:true={question.hasResponses}>
                                                                                    <template for:each={question.responses} for:item="resp">
                                                                                        <div key={resp.Id} class="slds-radio slds-m-bottom_xx-small">
                                                                                            <input type="radio" name={question.Id} disabled id={resp.Id} />
                                                                                            <label class="slds-radio__label" for={resp.Id}>
                                                                                                <span class="slds-radio_faux"></span>
                                                                                                <span class="slds-form-element__label">{resp.displayLabel}</span>
                                                                                            </label>
                                                                                        </div>
                                                                                    </template>
                                                                                </template>
                                                                            </template>
                                                                            <template if:true={question.isMultiSelectPreview}>
                                                                                <template if:true={question.hasResponses}>
                                                                                    <template for:each={question.responses} for:item="resp">
                                                                                        <div key={resp.Id} class="slds-checkbox slds-m-bottom_xx-small">
                                                                                            <input type="checkbox" disabled id={resp.Id} />
                                                                                            <label class="slds-checkbox__label" for={resp.Id}>
                                                                                                <span class="slds-checkbox_faux"></span>
                                                                                                <span class="slds-form-element__label">{resp.displayLabel}</span>
                                                                                            </label>
                                                                                        </div>
                                                                                    </template>
                                                                                </template>
                                                                            </template>
                                                                            <template if:true={question.isTablePreview}>
                                                                                <div class="slds-box slds-p-around_small" style="background: #f4f6f9;">
                                                                                    <p class="slds-text-body_small slds-text-color_weak">[Table input placeholder]</p>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasCanvasContent}>
                            <div class="empty-canvas">
                                <p class="slds-text-heading_small">No content to preview</p>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- ===== RIGHT: PROPERTIES PANEL ===== -->
            <div class="properties-panel">
                <h3 class="slds-text-heading_small slds-m-bottom_small">{propertiesPanelTitle}</h3>

                <template if:true={hasSelectedElement}>

                    <!-- Form Properties -->
                    <template if:true={isFormProperties}>
                        <lightning-input label="Name" value={selectedElement.Name} data-field="Name" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                        <lightning-textarea label="Description" value={selectedElement.C_Description__c} data-field="C_Description__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-textarea>
                        <lightning-combobox label="Status" value={selectedElement.C_Status__c} options={formStatusOptions} data-field="C_Status__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-combobox>
                        <lightning-input label="Version" type="number" value={selectedElement.C_Version__c} data-field="C_Version__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                        <lightning-input label="Default Language" value={selectedElement.C_Default_Language__c} data-field="C_Default_Language__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                    </template>

                    <!-- Category Properties -->
                    <template if:true={isCategoryProperties}>
                        <div class="prop-section">
                            <div class="prop-section-header" data-section="basic" onclick={handleTogglePropertySection}>
                                <lightning-icon icon-name={propSections.basic.chevron} size="xx-small" class="section-chevron"></lightning-icon>
                                <span>Basic</span>
                            </div>
                            <template if:true={propSections.basic.open}>
                                <div class="prop-section-body">
                                    <lightning-input label="Category Name" value={selectedElement.Name} data-field="Name" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                                    <lightning-textarea label="Description" value={selectedElement.C_Description__c} data-field="C_Description__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-textarea>
                                    <lightning-input label="Icon (SLDS icon name)" placeholder="e.g. standard:account" value={selectedElement.C_Icon__c} data-field="C_Icon__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                                    <lightning-input readonly label="Order" type="number" value={selectedElement.C_Order__c} data-field="C_Order__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                                    <lightning-input type="toggle" label="Is Active" checked={selectedElement.C_Is_Active__c} data-field="C_Is_Active__c" onchange={handlePropertyChange} class="slds-m-bottom_small"></lightning-input>
                                </div>
                            </template>
                        </div>
                        <div class="prop-section">
                            <div class="prop-section-header" data-section="dependencies" onclick={handleTogglePropertySection}>
                                <lightning-icon icon-name={propSections.dependencies.chevron} size="xx-small" class="section-chevron"></lightning-icon>
                                <span>Dependencies</span>
                            </div>
                            <template if:true={propSections.dependencies.open}>
                                <div class="prop-section-body">
                                    <c-form-dependency-inline
                                        element-id={selectedElement.Id}
                                        element-type="category"
                                        dependencies={dependencies}
                                        all-responses={allResponses}
                                        all-targets={allTargetElements}
                                        onsavedependency={handleInlineSaveDependency}
                                        ondeletedependency={handleInlineDeleteDependency}
                                        onupdatedependency={handleInlineUpdateDependency}>
                                    </c-form-dependency-inline>
                                </div>
                            </template>
                        </div>
                        <template if:true={showTranslations}>
                            <div class="prop-section">
                                <div class="prop-section-header" data-section="translations" onclick={handleTogglePropertySection}>
                                    <lightning-icon icon-name={propSections.translations.chevron} size="xx-small" class="section-chevron"></lightning-icon>
                                    <span>Translations</span>
                                </div>
                                <template if:true={propSections.translations.open}>
                                    <div class="prop-section-body">
                                        <c-form-translation-inline
                                            element-id={selectedElement.Id}
                                            element-type="category"
                                            default-language={formDefaultLanguage}>
                                        </c-form-translation-inline>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>

                    <!-- Page Properties -->
                    <template if:true={isPageProperties}>
                        <div class="prop-section">
                            <div class="prop-section-header" data-section="basic" onclick={handleTogglePropertySection}>

                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                            <div class="slds-col">
                                <lightning-input label="Search" value={repositorySearchTerm} onchange={handleRepositorySearchInput} onkeyup={handleRepositorySearchKeyup}></lightning-input>
                            </div>
                            <div class="slds-col slds-no-flex slds-align-bottom">
                                <lightning-button label="Search" variant="brand" onclick={handleRepositorySearchClick} disabled={repositorySearching}></lightning-button>
                            </div>
                        </div>
                        <template if:true={repositorySearching}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>
                        <template if:false={repositorySearching}>
                            <ul class="repo-result-list slds-m-top_small">
                                <template for:each={repositoryResults} for:item="row">
                                    <li key={row.id} class="repo-result-item">
                                        <button type="button" class="repo-result-button" data-id={row.id} onclick={handlePickRepositoryItem}>
                                            <span class="repo-result-title">{row.title}</span>
                                            <span class="repo-result-sub slds-text-body_small slds-text-color_weak">{row.subtitle}</span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                            <template if:true={repositoryResultsEmpty}>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">No matching assets. Try another search.</p>
                            </template>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeRepositoryModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Publish to repository confirmation -->
        <template if:true={showPromoteConfirm}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Publish to repository</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>{promoteConfirmMessage}</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCancelPromoteConfirm}></lightning-button>
                        <lightning-button label="Confirm" variant="brand" class="slds-m-left_x-small" onclick={handleConfirmPromote}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Config Modal -->
        <template if:true={showConfigModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCloseConfigModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Form Configuration</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            label="Layout Mode"
                            value={formLayoutMode}
                            options={layoutModeOptions}
                            onchange={handleConfigLayoutModeChange}
                            class="slds-m-bottom_small">
                        </lightning-combobox>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseConfigModal}></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            class="slds-m-left_x-small"
                            onclick={handleSaveConfig}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Clone Form Modal -->
        <template if:true={showCloneModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancelClone}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Clone Form</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="New Form Name" value={cloneFormName} onchange={handleCloneNameChange} required></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCancelClone}></lightning-button>
                        <lightning-button label="Clone" variant="brand" onclick={handleConfirmClone} class="slds-m-left_x-small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </template>
</template>
