<template>
    <section class="conversation-shell">
        <div class="conversation-progress-row">
            <div class="conversation-progress" role="progressbar" aria-valuenow={activeNumber} aria-valuemin="0" aria-valuemax={totalQuestions} aria-label="Progress through questions">
                <div class="conversation-progress-fill" style={progressWidth}></div>
            </div>
        
            <span class="counter" aria-live="polite" aria-atomic="true">{questionCounter}</span>
        </div>

        <template if:true={hasQuestions}>
            <article class="question-stage">
                <div class="question-meta">
                    <span class="question-number">{activeNumber}</span>
                    <span>{activeSectionName}</span>
                </div>

                <c-form-question
                    question={activeQuestion}
                    section-id={activeQuestion.sectionId}
                    read-only={readOnly}
                    feature-settings={featureSettings}
                    onvaluechange={handleValueChange}
                ></c-form-question>

                <template if:true={validationInlineError}>
                    <div
                        class="slds-form-element__help slds-text-color_error conversation-validation-error"
                        role="alert"
                    >
                        {validationInlineError}
                    </div>
                </template>

                <div class="conversation-actions">
                    <lightning-button
                        label="Previous"
                        variant="neutral"
                        onclick={handlePrevious}
                        disabled={isFirstQuestion}
                    ></lightning-button>

                    <lightning-button
                        label={nextLabel}
                        variant="brand"
                        onclick={handleNext}
                        disabled={isPrimaryActionDisabled}
                    ></lightning-button>
                </div>
            </article>
        </template>

        <template if:false={hasQuestions}>
            <div class="empty-state">
                No questions available on this page.
            </div>
        </template>
    </section>
</template>
