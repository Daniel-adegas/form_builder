<template>
    <template if:true={isListView}>
        <lightning-card title="Asset repository" icon-name="utility:collection">
            <div class="slds-p-around_medium">
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                    Browse reusable library sections and questions. Open an item to edit it with the visual builder.
                </p>

                <div class="asset-tab-bar slds-m-bottom_medium">
                    <button type="button" class={sectionsTabClass} data-tab="sections" onclick={handleTabButtonClick}>
                        Sections
                    </button>
                    <button type="button" class={questionsTabClass} data-tab="questions" onclick={handleTabButtonClick}>
                        Questions
                    </button>
                </div>

                <template if:true={isSectionsTab}>
                    <div>
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <div class="slds-col slds-grow">
                                <lightning-input
                                    type="search"
                                    label="Search sections"
                                    variant="label-hidden"
                                    placeholder="Search by name..."
                                    value={searchTerm}
                                    onchange={handleSearchChange}
                                ></lightning-input>
                            </div>
                            <lightning-button
                                label="Search"
                                variant="brand"
                                class="slds-m-left_small"
                                onclick={handleSearchSubmit}
                            ></lightning-button>
                        </div>
                        <template if:true={loading}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>
                        <template if:false={loading}>
                            <template if:true={sections.length}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={sections} for:item="row">
                                        <li key={row.Id} class="slds-item">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                                <div class="slds-col slds-grow">
                                                    <p class="slds-text-heading_small">{row.Name}</p>
                                                </div>
                                                <div class="slds-col slds-no-flex">
                                                    <lightning-button
                                                        label="Edit"
                                                        variant="brand"
                                                        data-id={row.Id}
                                                        data-name={row.Name}
                                                        onclick={handleEditSection}
                                                    ></lightning-button>
                                                </div>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={sections.length}>
                                <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                    No library sections found. Promote a section from a form or adjust your search.
                                </div>
                            </template>
                        </template>
                    </div>
                </template>

                <template if:true={isQuestionsTab}>
                    <div>
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <div class="slds-col slds-grow">
                                <lightning-input
                                    type="search"
                                    label="Search questions"
                                    variant="label-hidden"
                                    placeholder="Search by name..."
                                    value={searchTerm}
                                    onchange={handleSearchChange}
                                ></lightning-input>
                            </div>
                            <lightning-button
                                label="Search"
                                variant="brand"
                                class="slds-m-left_small"
                                onclick={handleSearchSubmit}
                            ></lightning-button>
                        </div>
                        <template if:true={loading}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>
                        <template if:false={loading}>
                            <template if:true={questions.length}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={questions} for:item="row">
                                        <li key={row.Id} class="slds-item">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                                <div class="slds-col slds-grow">
                                                    <p class="slds-text-heading_small">{row.Name}</p>
                                                    <p class="slds-text-body_small slds-m-top_xx-small">{row.C_Question_Text__c}</p>
                                                    <p class="slds-text-body_small slds-text-color_weak">Type: {row.C_Type__c}</p>
                                                </div>
                                                <div class="slds-col slds-no-flex">
                                                    <lightning-button
                                                        label="Edit"
                                                        variant="brand"
                                                        data-id={row.Id}
                                                        data-name={row.Name}
                                                        onclick={handleEditQuestion}
                                                    ></lightning-button>
                                                </div>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={questions.length}>
                                <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                    No library questions found. Promote a question from a form or adjust your search.
                                </div>
                            </template>
                        </template>
                    </div>
                </template>
            </div>
        </lightning-card>
    </template>

    <template if:true={isEditView}>
        <div class="repo-edit-shell slds-box slds-theme_default">
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                <lightning-button
                    label="Back to list"
                    icon-name="utility:back"
                    onclick={handleBackToList}
                    class="slds-m-right_small"
                ></lightning-button>
                <h2 class="slds-text-heading_medium">{editTitle}</h2>
            </div>
            <c-form-builder-visual
                repository-mode
                repository-focus-type={editFocusType}
                repository-focus-id={editFocusId}
            ></c-form-builder-visual>
        </div>
    </template>
</template>
