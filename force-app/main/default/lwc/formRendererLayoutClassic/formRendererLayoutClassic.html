<template>
  <div class="page-content">
    <template lwc:if={currentPage}>
      <!-- Page Title -->
      <div class="page-title-area">
        <h2 class="page-title">{currentPageName}</h2>
        <template lwc:if={currentPageDescription}>
          <p class="page-description">{currentPageDescription}</p>
        </template>
      </div>

      <!-- Sections -->
      <template for:each={currentSections} for:item="section">
        <div class="section-card" key={section.sectionId}>
          <div class="section-card-header">
            <h3 class="section-name">{section.translatedName}</h3>
            <template lwc:if={section.bonus}>
              <span class="bonus-badge">Bonus</span>
            </template>
          </div>
          <div class="section-card-body slds-grid slds-wrap slds-gutters_small">
            <template lwc:if={section.visibleQuestions.length}>
              <template for:each={section.visibleQuestions} for:item="quest">
                <div class={quest.questionLayoutClass} key={quest.questionId}>
                  <c-form-question
                    question={quest}
                    section-id={section.sectionId}
                    read-only={readOnly}
                    feature-settings={featureSettings}
                    onvaluechange={handleValueChange}
                  ></c-form-question>
                </div>
              </template>
            </template>
            <template lwc:else>
              <p class="empty-section-msg slds-col slds-size_1-of-1">
                No questions in this section.
              </p>
            </template>
          </div>
        </div>
      </template>
    </template>
  </div>
</template>
